<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr. Asadullah Tariq | Teaching, Research and Publications</title>
<meta name="description" content="Dr. Asadullah Tariq, Assistant Professor of AI and Robotics at New Uzbekistan University: courses, publications, research projects and service.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem("at-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --page:#F4F2FB; --surface:#FFFFFF; --sunk:#F7F6FC; --ink:#140F2E; --text:#2E2A45; --muted:#65607F; --line:#E6E2F2;
  --accent:#5B3DF5; --accent-ink:#FFFFFF; --accent-soft:#EEEAFE;
  --ai:#2F7FF0; --ai-soft:#E3EFFE; --mint:#1E7A52; --mint-bg:#E1F4EA; --warn:#8F5B06; --warn-bg:#FCF0D6;
  --shadow:0 1px 2px rgba(20,15,46,.05),0 12px 32px -16px rgba(40,20,120,.25);
  --hero:radial-gradient(70% 60% at 18% 0%,#4126E0 0%,transparent 62%),radial-gradient(55% 55% at 92% 28%,#3F86F4 0%,transparent 60%),radial-gradient(70% 60% at 50% 115%,#B79CFF 0%,transparent 62%),linear-gradient(180deg,#170A5C 0%,#2810A6 52%,#5B3DF5 100%);
  --cover:linear-gradient(150deg,#1D0B7A 0%,#3A24B8 60%,#5B3DF5 100%);
  --sans:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-lg:24px; --r-md:18px; --r-sm:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0D0A1F; --surface:#17132D; --sunk:#120F26; --ink:#F1EEFB; --text:#D7D2EA; --muted:#A39DBE; --line:#2B2547;
    --accent:#A996FF; --accent-ink:#120F26; --accent-soft:#2A2256;
    --ai:#7DB8FF; --ai-soft:#132A4A; --mint:#6FD6A3; --mint-bg:#14301F; --warn:#F2C46B; --warn-bg:#33270E;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 36px -18px rgba(0,0,0,.7);
    --hero:radial-gradient(70% 60% at 18% 0%,#33199F 0%,transparent 62%),radial-gradient(55% 55% at 92% 28%,#1F5BB8 0%,transparent 60%),radial-gradient(70% 60% at 50% 115%,#6C51E8 0%,transparent 62%),linear-gradient(180deg,#0E0640 0%,#1D0B7A 55%,#3A24B8 100%);
    --cover:linear-gradient(150deg,#0E0640 0%,#1D0B7A 60%,#3A24B8 100%);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0D0A1F; --surface:#17132D; --sunk:#120F26; --ink:#F1EEFB; --text:#D7D2EA; --muted:#A39DBE; --line:#2B2547;
  --accent:#A996FF; --accent-ink:#120F26; --accent-soft:#2A2256;
  --ai:#7DB8FF; --ai-soft:#132A4A; --mint:#6FD6A3; --mint-bg:#14301F; --warn:#F2C46B; --warn-bg:#33270E;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 36px -18px rgba(0,0,0,.7);
  --hero:radial-gradient(70% 60% at 18% 0%,#33199F 0%,transparent 62%),radial-gradient(55% 55% at 92% 28%,#1F5BB8 0%,transparent 60%),radial-gradient(70% 60% at 50% 115%,#6C51E8 0%,transparent 62%),linear-gradient(180deg,#0E0640 0%,#1D0B7A 55%,#3A24B8 100%);
  --cover:linear-gradient(150deg,#0E0640 0%,#1D0B7A 60%,#3A24B8 100%);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--page)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 1rem)}
body{margin:0;background:var(--page);color:var(--text);font:16.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#170A5C}
button,input{font:inherit;color:inherit}
img{max-width:100%}
a{color:var(--accent)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 1.5rem}
[hidden]{display:none!important}
h1,h2,h3{color:var(--ink);font-weight:600;letter-spacing:-.02em}
h2{font-size:clamp(1.6rem,3vw,2.1rem);margin:0 0 1.1rem;line-height:1.15}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.45rem;border-radius:999px;padding:.66rem 1.2rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:.96rem;text-decoration:none;cursor:pointer}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.light{background:#fff;color:#2810A6;border-color:#fff;font-weight:600}
.btn.light:hover{background:#F1EDFF}
.btn.glass{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.btn.glass:hover{background:rgba(255,255,255,.2)}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;isolation:isolate;border-radius:0 0 clamp(24px,4vw,48px) clamp(24px,4vw,48px)}
#net{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.85}
.nav{display:flex;align-items:center;gap:1rem;max-width:1240px;margin:0 auto;padding:1rem 1.5rem;position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:.7rem;color:#fff;text-decoration:none;font-weight:600;font-size:1.08rem;white-space:nowrap}
.brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.5)}
.navlinks{display:flex;gap:.1rem;list-style:none;margin:0 0 0 auto;padding:0}
.navlinks a{display:block;padding:.5rem .85rem;border-radius:999px;color:rgba(255,255,255,.86);text-decoration:none;font-weight:500;font-size:.93rem}
.navlinks a:hover{background:rgba(255,255,255,.1);color:#fff}
.navlinks a[aria-current="page"]{background:#fff;color:#2810A6}
.iconbtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);cursor:pointer;color:#fff;flex:none}
.iconbtn svg{width:19px;height:19px}
.icon-sun{display:none}
:root[data-theme="dark"] .icon-sun{display:block} :root[data-theme="dark"] .icon-moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .icon-sun{display:block}:root:not([data-theme="light"]) .icon-moon{display:none}}
#menuBtn{display:none}
.mobilemenu{position:relative;z-index:4;margin:0 1rem .5rem;padding:.5rem;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);display:grid;grid-template-columns:repeat(2,1fr);gap:.2rem}
.mobilemenu a{color:#fff;text-decoration:none;padding:.65rem .9rem;border-radius:12px;font-weight:500}
.mobilemenu a:hover,.mobilemenu a[aria-current="page"]{background:rgba(255,255,255,.16)}
@media (max-width:1100px){.navlinks{display:none}#menuBtn{display:inline-grid}.navright{margin-left:auto}}
.navright{display:flex;gap:.5rem}

.hero-body{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:2.5rem 1.5rem 5.5rem}
.hero-text{max-width:640px}
.hero h1{margin:0;font-size:clamp(2.6rem,6.4vw,4.6rem);line-height:1.02;letter-spacing:-.035em;color:#fff;text-wrap:balance}
.hero h1.course{font-size:clamp(2.2rem,4.8vw,3.6rem)}
.hero .sub{font-size:clamp(1.05rem,1.6vw,1.22rem);color:rgba(255,255,255,.86);margin:1.1rem 0 1.8rem;max-width:56ch;font-weight:300}
.hero .actions{display:flex;flex-wrap:wrap;gap:.6rem}
.hero-has-card .hero-text{max-width:calc(100% - 430px)}
@media (max-width:980px){.hero-has-card .hero-text{max-width:none}.hero-body{padding-bottom:3rem}}

/* page with overlapping side card (Harvard layout) */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:3rem;align-items:start}
.sidecard{margin-top:-330px;position:relative;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:visible}
.sidecard.with-photo{margin-top:-250px;padding-top:0}
@media (max-width:980px){
  .layout{grid-template-columns:1fr;gap:2rem}
  .sidecard,.sidecard.with-photo{margin-top:-1.5rem;order:-1}
}
.photo{width:190px;height:190px;border-radius:50%;margin:-95px auto .5rem;display:block;object-fit:cover;border:6px solid var(--surface);box-shadow:0 0 0 1px var(--line),var(--shadow);background:var(--accent-soft)}
@media (max-width:980px){.sidecard.with-photo{margin-top:4.5rem}}
.rows{list-style:none;margin:0;padding:.4rem 1.5rem 1rem}
.rows>li{display:grid;grid-template-columns:24px 1fr 1.2fr;gap:.75rem;align-items:start;padding:.9rem 0;border-top:1px solid var(--line)}
.rows>li:first-child{border-top:0}
.rows>li.stack{grid-template-columns:24px 1fr}
.rows>li.stack .val{grid-column:1/-1}
.rows>li>span>svg{width:20px;height:20px;color:var(--accent);margin-top:.15rem}
.rows .lab{font-weight:600;color:var(--ink);font-size:.95rem}
.rows .val{color:var(--text)}
.rows .val a{font-weight:500}
.sidecard .cover{border-radius:var(--r-lg) var(--r-lg) 0 0}

.chips{display:flex;flex-wrap:wrap;gap:.45rem;list-style:none;margin:0;padding:0}
.chip{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.36rem .85rem;font-size:.85rem;color:var(--accent);font-weight:600;text-decoration:none}
button.chip{cursor:pointer;color:var(--text)}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip img{height:18px;width:auto}

.section{padding:4rem 0 0}
.shead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.5rem 1.5rem;margin-bottom:1.5rem}
.shead h2{margin:0}
.shead p{margin:0;color:var(--muted);max-width:52ch}
.pill{display:inline-flex;align-items:center;gap:.35rem;font-size:.76rem;font-weight:600;padding:.2rem .65rem;border-radius:999px;background:var(--mint-bg);color:var(--mint)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.section:first-of-type{padding-top:2.5rem}
.bio{font-size:1.1rem;line-height:1.75;max-width:68ch}
.bio p{margin:0 0 1rem}
.lede{font-size:1.08rem;color:var(--muted);max-width:62ch;margin:-.4rem 0 1.6rem}

/* research group */
.labcard{position:relative;overflow:hidden;isolation:isolate;max-width:920px;margin:0 auto;padding:clamp(3rem,7vw,5.5rem) clamp(1.5rem,5vw,4rem);border-radius:clamp(28px,4vw,44px);background:var(--hero);color:#fff;text-align:center;box-shadow:0 30px 80px -40px rgba(40,20,160,.7)}
.labcard .orbits{position:absolute;inset:50% auto auto 50%;width:900px;height:900px;translate:-50% -50%;z-index:-1;pointer-events:none}
.labcard .orbits .o{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
.labcard .orbits .o2{animation-duration:90s;animation-direction:reverse}
.labcard .orbits .o3{animation-duration:40s}
.lab-logo{display:block;width:min(420px,88%);height:auto;margin:0 auto 1.6rem;color:#fff;--labsub:#BFE0FF;filter:drop-shadow(0 8px 30px rgba(63,134,244,.45))}
.labcard h2{color:#fff;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.08;letter-spacing:-.03em;margin:0 0 1rem;text-wrap:balance}
.labcard p{color:rgba(255,255,255,.85);font-size:1.08rem;max-width:58ch;margin:0 auto 1.8rem;font-weight:300}
.labcard .chips{justify-content:center;max-width:640px;margin:0 auto 2.2rem}
.labcard .chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff;font-weight:500}
.labcard .actions{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center}
.labcard .btn.light{padding:.85rem 1.6rem;font-size:1.02rem}
.labcard .url{display:block;margin-top:1.4rem;font-family:var(--mono);font-size:.82rem;color:rgba(255,255,255,.6)}
@media (prefers-reduced-motion:reduce){.labcard .orbits .o{animation:none}}
/* gradient icons + solid chips */
.rows>li>span>svg{width:24px;height:24px}
.ccard .subj svg,.ccard .mode svg{width:20px;height:20px}
.strip svg{width:22px;height:22px}
.rows .chip,.proj .chip{background:color-mix(in srgb,var(--accent) 70%,transparent);border-color:transparent;color:#fff;backdrop-filter:blur(4px);padding:.5rem 1.05rem;font-size:.92rem;font-weight:600;box-shadow:0 6px 16px -10px var(--accent)}
.rows a.chip:hover,.proj a.chip:hover{background:color-mix(in srgb,var(--accent) 85%,#000);color:var(--accent-ink)}
.rows .chips,.proj .chips{gap:.55rem}
.muted{color:var(--muted)}
.ccard .foot .logos{display:inline-flex;align-items:center;gap:.6rem}
.school .sch-item+.sch-item{margin-top:1.4rem;padding-top:1.4rem;border-top:1px solid var(--line)}
.chip.plink{padding:.32rem 1rem .32rem .32rem;gap:.55rem}
.rows .chip.plink{background:transparent;border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent);box-shadow:none;backdrop-filter:none}
.rows a.chip.plink:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);border-color:var(--accent)}
.rows .chip.plink .plogo{box-shadow:0 0 0 1px var(--line)}
.plogo{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff;flex:none;overflow:hidden}
.plogo img{width:19px;height:19px;object-fit:contain}
.plogo svg{width:21px;height:auto;color:#140F2E}
.uni .logo-tile img{object-fit:contain;object-position:left center}
:root[data-theme="dark"] .uni .logo-tile.keep{background:#fff;border-radius:12px;padding:.4rem .6rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .uni .logo-tile.keep{background:#fff;border-radius:12px;padding:.4rem .6rem}}
.wrap .unis{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:700px){.wrap .unis{grid-template-columns:1fr}}
/* university marquee */
.marquee{position:relative;overflow:hidden;padding:1rem 0 .5rem;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.mq-track{display:flex;width:max-content;animation:mq 38s linear infinite}
.marquee:hover .mq-track,.marquee:focus-within .mq-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mq-item{display:flex;flex-direction:column;align-items:center;gap:.7rem;width:300px;padding:0 2rem;text-decoration:none;color:inherit;text-align:center;flex:none}
.mq-logo{height:84px;display:flex;align-items:center;justify-content:center;transition:transform .25s}
.mq-item:hover .mq-logo{transform:scale(1.06)}
.mq-logo .logo-tile{height:100%}
.mq-logo .logo-tile img{height:100%;width:auto;max-width:240px;object-fit:contain}
.mq-name{font-weight:600;color:var(--ink);font-size:1.02rem;line-height:1.3}
.mq-place{font-size:.85rem;color:var(--muted);margin-top:-.4rem}
.mq-item .pill{margin-top:-.35rem}
:root[data-theme="dark"] .mq-logo .logo-tile.keep{background:#fff;border-radius:14px;padding:.45rem .7rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mq-logo .logo-tile.keep{background:#fff;border-radius:14px;padding:.45rem .7rem}}
@media (prefers-reduced-motion:reduce){.mq-track{animation:none;flex-wrap:wrap;width:auto;justify-content:center}.mq-item[aria-hidden="true"]{display:none}.marquee{-webkit-mask-image:none;mask-image:none}}
@media (max-width:600px){.mq-item{width:230px;padding:0 1.2rem}.mq-logo{height:64px}}
/* materials */
.mat-cta{display:flex;align-items:center;gap:1rem;margin:.5rem 0 1rem;padding:1.1rem 1.3rem;border-radius:var(--r-lg);background:var(--hero);color:#fff;text-decoration:none;box-shadow:0 18px 40px -24px rgba(65,38,224,.8);max-width:68ch}
.mat-cta .ico{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.16);flex:none}
.mat-cta .ico svg{width:24px;height:24px}
.mat-cta strong{display:block;font-size:1.08rem}
.mat-cta small{color:rgba(255,255,255,.8);font-size:.9rem}
.mat-cta .go{margin-left:auto;background:#fff;color:#2810A6;font-weight:600;padding:.5rem 1rem;border-radius:999px;font-size:.92rem}
.lectures{list-style:none;margin:0;padding:0;display:grid;gap:1rem}
.lec{display:grid;grid-template-columns:64px 1fr auto;gap:1.25rem;align-items:center;padding:1.2rem 1.4rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.lec .num{display:grid;place-items:center;width:64px;height:64px;border-radius:18px;background:linear-gradient(140deg,#00C2FF,#5B4BFF);color:#fff;font-weight:700;font-size:1.35rem;letter-spacing:-.02em}
.lec h3{margin:0 0 .25rem;font-size:1.15rem}
.lec p{margin:0 0 .45rem;color:var(--muted);font-size:.95rem;max-width:70ch}
.lec .meta{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--text);font-weight:500}
.lec .meta svg{width:18px;height:18px}
.lec-actions{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
.btn.primary svg{width:17px;height:17px}
.note{display:flex;align-items:center;gap:.5rem;margin-top:1.8rem;color:var(--muted);font-size:.92rem}
.note svg{width:18px;height:18px}
@media (max-width:720px){.lec{grid-template-columns:48px 1fr}.lec .num{width:48px;height:48px;font-size:1.05rem;border-radius:14px}.lec-actions{grid-column:1/-1;justify-content:flex-start}}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-top:2.5rem}
.stats div{padding:1.3rem 1.4rem;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-size:2.1rem;font-weight:600;color:var(--ink);letter-spacing:-.03em;line-height:1.05}
.stats span{font-size:.9rem;color:var(--muted)}
@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}.stats div:nth-child(3){border-left:0}.stats div:nth-child(n+3){border-top:1px solid var(--line)}}
/* placeholders */
.ph{position:relative;padding:1.4rem;border-radius:var(--r-lg);border:1.5px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,color-mix(in srgb,var(--accent) 70%,transparent),color-mix(in srgb,var(--ai) 55%,transparent) 50%,color-mix(in srgb,var(--mint) 60%,transparent)) border-box;box-shadow:var(--shadow);overflow:hidden}
.ph::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%);pointer-events:none}
.ph-head{display:flex;gap:.9rem;align-items:flex-start}
.ph .ic{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:linear-gradient(140deg,#4126E0,#3F86F4);color:#fff;box-shadow:0 8px 20px -10px #4126E0}
.ph .ic svg{width:22px;height:22px}
.ph strong{display:block;color:var(--ink);font-weight:600;font-size:1.02rem}
.ph p{margin:.2rem 0 0;font-size:.9rem;color:var(--muted);line-height:1.5}
.ph-rows{list-style:none;margin:1.2rem 0 1.1rem;padding:0;display:grid;gap:.5rem}
.ph-rows li{display:flex;align-items:center;gap:.75rem;padding:.6rem .7rem;border-radius:12px;background:var(--sunk);border:1px solid var(--line)}
.ph-rows span{flex:1;display:grid;gap:.4rem}
.ph-rows i{display:block;height:8px;border-radius:6px;background:linear-gradient(90deg,var(--line) 0%,color-mix(in srgb,var(--accent) 22%,var(--line)) 50%,var(--line) 100%);background-size:200% 100%;animation:shim 1.8s ease-in-out infinite;animation-delay:var(--d,0s)}
.ph-rows i.av{width:28px;height:28px;border-radius:9px;flex:none}
.ph-rows i.yr{width:38px;height:10px;flex:none}
@keyframes shim{0%{background-position:100% 0}100%{background-position:-100% 0}}
.soon{display:inline-flex;align-items:center;gap:.45rem;font-size:.78rem;font-weight:600;padding:.25rem .7rem;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.soon::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:soondot 1.6s ease-in-out infinite}
@keyframes soondot{50%{opacity:.3;transform:scale(.7)}}
/* animated cover art */
.cover svg .lay{transition:transform .35s cubic-bezier(.2,.7,.3,1)}
.cover .back{transform:translate(calc(var(--px,0)*-10px),calc(var(--py,0)*-8px))}
.cover .mid{transform:translate(calc(var(--px,0)*7px),calc(var(--py,0)*5px))}
.cover .front{transform:translate(calc(var(--px,0)*16px),calc(var(--py,0)*12px))}
.cover .spot{transition:opacity .3s;opacity:0}
.cover:hover .spot{opacity:1}
.cover .flow{stroke-dasharray:6 9;animation:flow 1.4s linear infinite}
.cover .flow.rev{animation-direction:reverse}
.cover:hover .flow{animation-duration:.6s}
@keyframes flow{to{stroke-dashoffset:-30}}
.cover .float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.cover .blink{animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}
.cover .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{opacity:.6;transform:scale(.4)}80%,100%{opacity:0;transform:scale(1.5)}}
.cover .visit{transform-box:fill-box;transform-origin:center;animation:visit 3.6s ease-out infinite}
@keyframes visit{0%{opacity:0;transform:scale(.5)}8%{opacity:.55;transform:scale(1)}30%,100%{opacity:0;transform:scale(1.25)}}
.cover .visit-dot{animation:vdot 3.6s ease-out infinite}
@keyframes vdot{0%,100%{fill:#BFE0FF}8%,20%{fill:#7CF0B5}}
.cover .spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cover .core{animation:core 2.6s ease-in-out infinite}
@keyframes core{50%{opacity:.6}}
.cover .shim{animation:shimop 2.2s ease-in-out infinite;opacity:.35}
@keyframes shimop{50%{opacity:.75}}
.cover .pop{transform-box:fill-box;transform-origin:center;animation:pop 3.5s ease-in-out infinite;opacity:0}
@keyframes pop{0%,100%{opacity:0;transform:scale(.3) translateY(6px)}30%,60%{opacity:.9;transform:scale(1) translateY(-6px)}}
.cover .orb{animation:orb 12s ease-in-out infinite}
.cover .orb.b{animation-duration:15s;animation-direction:reverse}
@keyframes orb{50%{transform:translate(-24px,14px)}}
@media (prefers-reduced-motion:reduce){.cover *,.ph *,.soon::before{animation:none!important}.cover svg .lay{transition:none}}
/* course cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem}
.ccard{display:flex;flex-direction:column;transition:border-color .15s,transform .15s;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;text-decoration:none;color:inherit}
.ccard:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.ccard:hover{transform:none}}
.ccard:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.cover{position:relative;aspect-ratio:16/9;background:var(--cover);overflow:hidden}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.ccard .body{padding:1.15rem 1.3rem 1.2rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.ccard .subj{display:flex;align-items:center;gap:.45rem;font-size:.85rem;color:var(--muted);font-weight:500}
.ccard .subj svg{width:16px;height:16px;color:var(--accent)}
.ccard .mode{display:flex;align-items:center;gap:.4rem;font-size:.82rem;font-weight:700;color:var(--ink)}
.ccard .mode svg{width:15px;height:15px}
.ccard h3{margin:0;font-size:1.35rem;line-height:1.2;color:var(--accent);font-weight:600}
.ccard p{margin:0;color:var(--text);font-size:.96rem}
.ccard .foot .logo-tile img{height:28px;max-width:120px}
.ccard .foot{margin-top:auto;padding-top:.9rem;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:.8rem;font-size:.85rem;color:var(--muted)}
.logo-tile{display:inline-flex;align-items:center;justify-content:center;background:transparent}
.logo-tile img{display:block;height:30px;width:auto;object-fit:contain}
:root[data-theme="dark"] .logo-tile:not(.keep) img{filter:brightness(0) invert(1);opacity:.92}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-tile:not(.keep) img{filter:brightness(0) invert(1);opacity:.92}}
.status{font-size:.78rem;font-weight:600;padding:.18rem .65rem;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.status.now{background:var(--mint-bg);color:var(--mint);border-color:transparent}

/* universities strip */
.unis{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}
.uni{display:flex;flex-direction:column;gap:1rem;align-items:flex-start;padding:1.4rem 1.4rem 1.25rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);text-decoration:none;color:inherit;cursor:pointer;text-align:left;width:100%;position:relative;transition:border-color .15s,box-shadow .15s}
.uni:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.uni .pill{position:absolute;top:1.1rem;right:1.1rem}
.uni[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.uni .logo-tile{height:64px;justify-content:flex-start}
.uni .logo-tile img{height:100%;max-width:100%}
.uni .meta{display:flex;flex-direction:column;gap:.15rem;padding-top:.9rem;border-top:1px solid var(--line);width:100%}
.uni strong{display:block;color:var(--ink);font-weight:600;font-size:1.05rem;line-height:1.25}
.uni .meta .sch{color:var(--accent);font-weight:500;font-size:.9rem;line-height:1.35}
.uni span{font-size:.85rem;color:var(--muted)}

/* course page */
.strip{display:flex;flex-wrap:wrap;gap:1.5rem 2.5rem;padding:1.2rem 0;border-bottom:1px solid var(--line);margin-bottom:.5rem;color:var(--text)}
.strip span{display:inline-flex;align-items:center;gap:.5rem}
.strip svg{width:20px;height:20px;color:var(--accent)}
.learn{list-style:none;margin:0 0 2.5rem;padding:0;display:grid;gap:.8rem;max-width:68ch}
.learn li{position:relative;padding-left:2rem;font-size:1.04rem}
.learn li::before{content:"";position:absolute;left:0;top:.3rem;width:1.15rem;height:1.15rem;border-radius:50%;background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.prose{max-width:68ch;font-size:1.04rem;line-height:1.75}
.prose p{margin:0 0 1rem}
.school{text-align:center;padding:1.2rem 1.5rem 1.6rem;border-top:1px solid var(--line)}
.school h3{margin:0 0 1rem;font-size:1.3rem}
.school .logo-tile img{height:96px;max-width:230px}
.school p{margin:.8rem 0 0;font-weight:600;color:var(--ink)}
.school small{display:block;margin-top:.25rem;font-size:.9rem;font-weight:500;color:var(--accent)}
.crumbs{font-size:.9rem;margin-bottom:1rem;color:rgba(255,255,255,.75)}
.crumbs a{color:#fff;text-decoration:none;font-weight:500}
.crumbs a:hover{text-decoration:underline}

/* publications */
.counts{display:flex;flex-wrap:wrap;gap:2.2rem;margin-top:1.8rem}
.counts div{font-size:.9rem;color:rgba(255,255,255,.8)}
.counts b{display:block;font-size:2.3rem;font-weight:600;line-height:1;color:#fff;letter-spacing:-.03em}
.tools{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-bottom:1.5rem}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:.62rem 1rem .62rem 2.6rem;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.search svg{position:absolute;left:.95rem;top:50%;translate:0 -50%;width:17px;height:17px;color:var(--muted)}
.ygroup{display:grid;grid-template-columns:110px 1fr;gap:1.5rem;padding:1.5rem 0;border-top:1px solid var(--line)}
.ygroup>h3{margin:0;font-size:2rem;font-weight:600;color:var(--accent);letter-spacing:-.03em;line-height:1}
@media (max-width:640px){.ygroup{grid-template-columns:1fr;gap:.6rem}}
.pubs{list-style:none;margin:0;padding:0;display:grid;gap:1rem}
.pub{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:1.05rem 1.25rem}
.pub h4{margin:0 0 .3rem;font-size:1.08rem;line-height:1.35;color:var(--ink);font-weight:600}
.pub .au{margin:0;font-size:.92rem;color:var(--muted)}
.pub .au b{color:var(--ink);font-weight:600}
.pub .ve{margin:.2rem 0 .6rem;font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.tag{font-size:.76rem;font-weight:600;padding:.16rem .6rem;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.conf{background:var(--ai-soft);color:var(--ai)}
.tag.badge{background:var(--sunk);color:var(--text);border:1px solid var(--line);font-family:var(--mono);font-weight:500}
.tag.acc{background:var(--warn-bg);color:var(--warn)}
.tag.link{background:transparent;border:1px solid var(--line);color:var(--accent);text-decoration:none}
.empty{padding:2rem;border:1px dashed var(--line);border-radius:var(--r-md);color:var(--muted);text-align:center}

/* projects */
.proj{display:grid;grid-template-columns:240px 1fr;gap:2rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:1.6rem;margin-bottom:1.25rem}
@media (max-width:760px){.proj{grid-template-columns:1fr;gap:1rem}}
.proj dl{margin:0;display:grid;gap:.75rem;font-size:.92rem;align-content:start}
.proj dt{font-size:.8rem;color:var(--muted);font-weight:600}
.proj dd{margin:0;color:var(--ink)}
.proj h3{margin:0 0 .5rem;font-size:1.45rem}
.proj p{margin:0 0 1rem;max-width:66ch}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.area{padding:1.1rem 1.2rem;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.area h3{margin:0 0 .3rem;font-size:1.08rem}
.area p{margin:0;font-size:.94rem;color:var(--muted)}

/* service + lists */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:2.5rem}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.list li{display:flex;justify-content:space-between;gap:1rem;padding:1rem 1.2rem;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .t{color:var(--ink);font-weight:600}
.list small{display:block;color:var(--muted);font-size:.88rem;font-weight:400;margin-top:.1rem}
.list .y{font-family:var(--mono);font-size:.85rem;color:var(--muted);white-space:nowrap}
.callout{margin-top:1rem;padding:1.4rem;border-radius:var(--r-lg);background:var(--hero);color:#fff}
.callout h3{color:#fff;margin:0 0 .4rem;font-size:1.25rem}
.callout p{margin:0 0 1rem;color:rgba(255,255,255,.85);max-width:70ch}
.callout .chips .chip{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:43px;top:20px;bottom:20px;width:2px;background:var(--line)}
.timeline li{position:relative;display:grid;grid-template-columns:88px 1fr;gap:1.25rem;padding-bottom:1.75rem}
.timeline .logo-tile,.timeline .mono{width:88px;height:88px;position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:.6rem;box-shadow:var(--shadow)}
.timeline .logo-tile.keep{padding:.4rem}
.cols>.section{padding-top:3rem}
.timeline .logo-tile img{height:100%;width:100%}
.timeline .mono{display:grid;place-items:center;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:1.05rem;border:1px solid var(--line)}
.timeline .when{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.timeline h3{margin:.1rem 0;font-size:1.25rem}
.timeline .where{color:var(--text)}
.timeline p{margin:.35rem 0 0;color:var(--muted);max-width:64ch}

footer{margin-top:4rem;padding:2rem 0 2.5rem;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between}
footer a{color:var(--text)}

}

    { id:"cloud-computing", uni:"nuu", art:"cloud", title:"Cloud Computing", subject:"Computer Science", level:"Undergraduate", difficulty:"Intermediate", format:"In person", duration:"One semester", terms:"",
      tagline:"Learn how modern cloud platforms deliver computing, storage and networking as on-demand services.",
      learn:["Explain cloud service and deployment models (IaaS, PaaS, SaaS; public, private and hybrid)","Use virtualisation and containers to package and run applications","Deploy, scale and monitor applications on a public cloud platform","Design for availability, elasticity and cost, and reason about the trade-offs","Apply core cloud security and identity practices"],
      description:["This course introduces the technologies and ideas behind cloud computing, from virtual machines and containers to managed services and serverless functions. Students learn how large-scale systems stay available, elastic and secure.","Weekly labs give hands-on practice on a real cloud platform, and the course closes with a team project in which students design, deploy and present a cloud-hosted application."],
      topics:["Virtualisation","Containers","Distributed systems","Serverless","Cloud security"] },
    { id:"dsa", unis:["nuu","uaeu","superior"], art:"graph", title:"Data Structures and Algorithms", subject:"Computer Science", level:"Undergraduate", difficulty:"Intermediate", format:"In person", duration:"One semester", terms:"",
      tagline:"Choose the right data structure and algorithm, and prove why it is fast enough.",
      learn:["Analyse algorithms with asymptotic notation and recurrences","Implement lists, stacks, queues, trees, heaps and hash tables","Apply sorting, searching and graph algorithms to real problems","Use divide and conquer, greedy and dynamic programming techniques","Compare solutions by time and memory cost"],
      description:["This course covers the core data structures and algorithms every computer scientist relies on, with equal weight on implementation and analysis.","Students write and test their own implementations, then apply them to programming problems that reward choosing the right tool for the job."],
      topics:["Complexity analysis","Trees and graphs","Sorting","Dynamic programming","Hashing"] },
    { id:"computer-architecture", unis:["cud","superior"], art:"chip", title:"Computer Architecture", subject:"Computer Engineering", level:"Undergraduate", difficulty:"Intermediate", format:"In person", duration:"One semester", terms:"",
      tagline:"See how software runs on hardware, from instructions to pipelines and memory.",
      learn:["Represent data and instructions in binary and understand instruction set design","Trace how a processor’s datapath and control unit execute instructions","Explain pipelining, hazards and how they are resolved","Analyse cache and memory hierarchy performance","Measure and compare processor performance"],
      description:["This course explains how computers are organised and how their design affects the speed and efficiency of software.","Students work through assembly programming exercises and processor simulations to connect high-level code with what happens inside the machine."],
      topics:["Instruction sets","Assembly","Pipelining","Memory hierarchy","Performance"] },
    { id:"cloud-architecture", uni:"cud", art:"arch", title:"Cloud Architecture", subject:"Computer Science", level:"Undergraduate", difficulty:"Intermediate", format:"In person", duration:"One semester", terms:"",
      tagline:"Design, build and secure systems on the cloud, from service models to serverless and machine learning at scale.",
      learn:["Compare IaaS, PaaS and SaaS and choose the right deployment model for a workload","Design cloud networks with VPCs, load balancers and CDNs","Pick the right storage for the job: object, block, file, relational, key-value and data lakes","Break monoliths into services and microservices using cloud-native design patterns","Package and run applications with containers, orchestration and serverless functions, and estimate their cost","Secure cloud systems with identity and access management, auditing, logging and observability","Deploy machine learning and high-performance computing workloads on cloud infrastructure"],
      description:["This course takes students through how modern systems are designed and run on the cloud. It starts with service and deployment models, then builds up the core layers of any cloud architecture: networking, storage, application design, compute and security.","Each lecture pairs concepts with real provider services and worked cost and availability calculations, so students can justify their design choices. The course ends with machine learning and high-performance computing on the cloud."],
      topics:["Service models","Cloud networking","Cloud storage","Microservices","Containers","Serverless","IAM and security","Observability","ML and HPC"],
      materials:[
        { title:"Cloud service models and infrastructure", desc:"What cloud computing is, IaaS, PaaS and SaaS, deployment models and choosing the right one, with worked calculations.", file:"01-cloud-service-models.pdf", pages:39, size:"2.1 MB" },
        { title:"Cloud networking in practice", desc:"A short networking review, virtual private clouds, load balancing and content delivery networks.", file:"02-cloud-networking.pdf", pages:34, size:"0.6 MB" },
        { title:"Storage on the cloud", desc:"Object, block and file storage, relational and NoSQL databases, caches, data warehouses, lakes and lakehouses.", file:"03-storage-on-the-cloud.pdf", pages:26, size:"1.1 MB" },
        { title:"Cloud-native application design", desc:"From monoliths to client-server, SOA and microservices, and how containers and serverless implement them.", file:"04-cloud-native-application-design.pdf", pages:21, size:"3.2 MB" },
        { title:"Containers and container orchestration", desc:"The history of web hosting, containers, images and registries, and orchestration with Kubernetes.", file:"05-containers-and-orchestration.pdf", pages:33, size:"3.3 MB" },
        { title:"Serverless computing", desc:"Functions as a service, AWS Lambda, cold starts, pricing against EC2, edge functions and serverless beyond FaaS.", file:"06-serverless-computing.pdf", pages:32, size:"1.3 MB" },
        { title:"Cloud security I: identity and access management", desc:"From ClickOps to infrastructure as code, IAM users, roles and policies, and least privilege.", file:"07-security-iam.pdf", pages:39, size:"0.9 MB" },
        { title:"Cloud security II: auditing, logging and observability", desc:"Harder security best practices, audit trails, centralised logging, metrics and tracing.", file:"08-security-observability.pdf", pages:33, size:"2.1 MB" },
        { title:"Machine learning and high-performance computing", desc:"An overview of ML and MLOps, deploying AI at scale, LLM inference and HPC on the cloud.", file:"09-machine-learning-and-hpc.pdf", pages:36, size:"0.9 MB" }
      ], materialsZip:"cloud-architecture-lectures.zip" },

      tagline:"Build modern, component-based web applications with React, from the interface to the API behind it.",

      description:["This course teaches students to build complete web applications using React, the most widely used library for component-based user interfaces.","Students start with the foundations of the web, then build a React application across the semester, adding components, routing, state and a back-end API before deploying it online."],

/* Course cover art: animated, layered SVG scenes that drift with the pointer */

    mid+=`<g><ellipse cx="200" cy="164" rx="34" ry="9" fill="rgba(255,255,255,.12)" ${L}/><path d="M166 164v26c0 5 15 9 34 9s34-4 34-9v-26" fill="rgba(255,255,255,.06)" ${L}/><path d="M166 177c0 5 15 9 34 9s34-4 34-9" ${L} opacity=".6"/></g>`;
  }else if(kind==="graph"){
    const N=[[70,60],[150,40],[240,70],[330,50],[110,140],[200,130],[290,150],[160,195],[250,200]];

      +N.map(([x,y],i)=>`${P.includes(i)?halo(x,y,16,"#7CF0B5","ping",P.indexOf(i)*.8):""}<circle cx="${x}" cy="${y}" r="9" fill="rgba(255,255,255,.08)" stroke="${P.includes(i)?"#7CF0B5":"#BFE0FF"}" stroke-width="2"/>${dot(x,y,3.5,P.includes(i)?"#7CF0B5":"#BFE0FF")}`).join("");

    for(let i=0;i<5;i++){const p=75+i*20;

      if(i%2===0){front+=token(`M${p} 22V55`,1.6,i*.3,"#7CF0B5",2.8)+token(`M300 ${p+15}H260`,1.9,i*.35+.5,"#BFE0FF",2.8)+token(`M${p} 208V175`,1.7,i*.25+.8,"#BFE0FF",2.8)+token(`M100 ${p+15}H140`,2,i*.3+.2,"#7CF0B5",2.8)}
    }
  }else if(kind==="web"){
    mid=`<g class="float"><rect x="70" y="32" width="260" height="168" rx="14" fill="rgba(255,255,255,.07)" ${L} stroke-width="3"/><path d="M70 60h260" ${L}/>
      ${dot(90,46,4.5,"#FF8FA3")}${dot(105,46,4.5,"#F2C46B")}${dot(120,46,4.5,"#7CF0B5")}<rect x="140" y="40" width="150" height="12" rx="6" fill="rgba(255,255,255,.12)"/>
      <rect class="shim" x="90" y="76" width="140" height="16" rx="5" fill="#CDBDFF"/><rect class="shim" style="animation-delay:.3s" x="90" y="102" width="100" height="9" rx="4" fill="#CDBDFF"/><rect class="shim" style="animation-delay:.5s" x="90" y="117" width="120" height="9" rx="4" fill="#CDBDFF"/>
      <rect x="90" y="145" width="70" height="36" rx="8" fill="#7CF0B5" opacity=".85"/><path d="M106 163h38" stroke="#0B3A24" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="172" y="145" width="70" height="36" rx="8" ${L}/>
      <rect x="252" y="76" width="60" height="105" rx="8" fill="rgba(191,224,255,.14)" stroke="#BFE0FF" stroke-width="2"/><g class="spin" style="animation-duration:10s"><ellipse cx="282" cy="108" rx="19" ry="7" fill="none" stroke="#7DD3FC" stroke-width="1.8"/><ellipse cx="282" cy="108" rx="19" ry="7" fill="none" stroke="#7DD3FC" stroke-width="1.8" transform="rotate(60 282 108)"/><ellipse cx="282" cy="108" rx="19" ry="7" fill="none" stroke="#7DD3FC" stroke-width="1.8" transform="rotate(120 282 108)"/></g><circle cx="282" cy="108" r="3.6" fill="#7DD3FC"/><rect class="shim" style="animation-delay:.7s" x="262" y="138" width="34" height="7" rx="3" fill="#BFE0FF"/></g>`;
    const kt=(a)=>`0;${a-.001};${a};${a+.12};1`;
    front=`<circle cx="125" cy="163" fill="none" stroke="#fff" stroke-width="2"><animate attributeName="r" values="0;0;4;22;22" keyTimes="${kt(.2)}" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;.9;0;0" keyTimes="${kt(.2)}" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="282" cy="108" fill="none" stroke="#fff" stroke-width="2"><animate attributeName="r" values="0;0;4;22;22" keyTimes="${kt(.53)}" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;.9;0;0" keyTimes="${kt(.53)}" dur="6s" repeatCount="indefinite"/></circle>
      <g><path d="M0 0L0 17L4.5 13L7.5 20L10.5 18.8L7.6 12L13 12Z" fill="#fff" stroke="#1D0B6E" stroke-width="1.2" stroke-linejoin="round"/><animateMotion dur="6s" repeatCount="indefinite" path="M330 205 L125 163 L282 108 L330 205" keyPoints="0;.4389;.4389;.7726;.7726;1" keyTimes="0;.2;.33;.53;.66;1" calcMode="linear"/></g>`;

}
const cover=c=>`<div class="cover" style="background:${KIND_BG[c.art]||"var(--cover)"}">${art(c.art)}</div>`;

function uniMarquee(){
  const item=(u,hidden)=>`<a class="mq-item" href="#teaching"${hidden?' aria-hidden="true" tabindex="-1"':""}><span class="mq-logo">${logo(u.main||u.id,hidden?"":u.name)}</span><span class="mq-name">${esc(u.name)}</span>${u.current?'<span class="pill">Active</span>':`<span class="mq-place">${esc(u.place)}</span>`}</a>`;
  const reps=Math.max(2,Math.ceil(8/SITE.universities.length));
  const half=i=>Array.from({length:reps},(_,r)=>SITE.universities.map(u=>item(u,i>0||r>0)).join("")).join("");
  return `<div class="marquee" role="region" aria-label="Universities where I teach"><div class="mq-track">${half(0)}${half(1)}</div></div>`;
}
function uniCard(u,btn){
  const n=SITE.courses.filter(c=>cIds(c).includes(u.id)).length;
  const inner=`${u.current?'<span class="pill">Active</span>':""}${logo(u.main||u.id,u.name)}<span class="meta"><strong>${esc(u.name)}</strong>${u.school?`<span class="sch">${esc(u.school)}</span>`:""}<span>${esc(u.place)}, ${n} course${n===1?"":"s"}</span></span>`;
  return btn?`<button type="button" class="uni" data-u="${u.id}" aria-pressed="false">${inner}</button>`:`<a class="uni" href="#teaching">${inner}</a>`;
}
function courseCard(c){
  const us=cUnis(c),act=us.some(u=>u.current);

/* ---------- router ---------- */
function route(){
  const h=(location.hash||"").slice(1);
  let v,active=h;
  if(h.startsWith("course-")){v=V.course(h.slice(7));active="teaching"}
  else if(h.startsWith("materials-")){v=V.materials(h.slice(10));active="teaching"}
  else if(V[h]&&h!=="course"){v=V[h]()}
  else{v=V.about();active="about"}
  const hb=$("#heroBody");hb.innerHTML=v.hero;hb.classList.toggle("hero-has-card",!!v.card);
  const m=$("#main");m.innerHTML=v.body;
  m.classList.remove("enter");void m.offsetWidth;m.classList.add("enter");
  document.querySelectorAll("#navlinks a,#mobileMenu a").forEach(a=>a.getAttribute("href")==="#"+active?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  $("#mobileMenu").hidden=true;$("#menuBtn").setAttribute("aria-expanded","false");
  v.after&&v.after();
  if(h.startsWith("materials-"))document.title="Course materials | "+SITE.name;else document.title=(active==="about"?SITE.name:`${(NAV.find(n=>n[0]===active)||[,""])[1]} | ${SITE.name}`);
  window.scrollTo(0,0);
}

  const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("at-theme",r.dataset.theme)}catch(e){}
});
window.addEventListener("hashchange",route);
(function(){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;let last=null;
  const reset=c=>{c.style.removeProperty("--px");c.style.removeProperty("--py")};
  document.addEventListener("pointermove",e=>{
    const c=e.target.closest?e.target.closest(".cover"):null;
    if(last&&last!==c)reset(last);last=c;if(!c)return;
    const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    if(!reduce){c.style.setProperty("--px",(x-.5)*2);c.style.setProperty("--py",(y-.5)*2)}
    const sp=c.querySelector(".spot");if(sp){const vb=400/r.width;const s=Math.max(vb,225/r.height);sp.setAttribute("cx",200+(e.clientX-r.left-r.width/2)*s);sp.setAttribute("cy",112.5+(e.clientY-r.top-r.height/2)*s)}
  },{passive:true});
  document.addEventListener("pointerleave",()=>{if(last)reset(last);last=null});
  if(reduce){new MutationObserver(()=>document.querySelectorAll(".cover svg").forEach(s=>s.pauseAnimations&&s.pauseAnimations())).observe(document.getElementById("main"),{childList:true,subtree:true})}
})();

/* ---------- hero network: drifting nodes that link up near each other ---------- */
(function(){
  const cv=$("#net"),cx=cv.getContext("2d");const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,N=[],raf=0,M={x:-999,y:-999};
  const COL=["205,189,255","191,224,255","124,240,181"];
  function size(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
    const n=Math.round(Math.min(60,W*H/14000));N=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.6+1,c:COL[Math.random()<.12?2:Math.random()<.5?1:0]}))}
  function frame(){
    cx.clearRect(0,0,W,H);const D=130;
    for(const p of N){if(!reduce){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}}
    for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){const a=N[i],b=N[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<D){cx.strokeStyle=`rgba(205,189,255,${(1-d/D)*.28})`;cx.lineWidth=1;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}
    for(const p of N){const dm=Math.hypot(p.x-M.x,p.y-M.y);if(dm<160){cx.strokeStyle=`rgba(124,240,181,${(1-dm/160)*.5})`;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(M.x,M.y);cx.stroke()}
      cx.fillStyle=`rgba(${p.c},.9)`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}
    if(!reduce)raf=requestAnimationFrame(frame);
  }
  const hero=$("#hero");
  hero.addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();M.x=e.clientX-r.left;M.y=e.clientY-r.top;if(reduce)frame()});
  hero.addEventListener("pointerleave",()=>{M.x=M.y=-999;if(reduce)frame()});
  new ResizeObserver(()=>{size();if(reduce)frame()}).observe(hero);
  size();
  new IntersectionObserver(es=>{for(const e of es){cancelAnimationFrame(raf);if(e.isIntersecting)frame()}}).observe(hero);
})();
